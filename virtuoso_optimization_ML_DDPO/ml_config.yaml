# =============================================================================
# ml_config.yaml — Online ML optimizer for the switchable filter design
# =============================================================================

virtuoso_config: "/disk/mcao53/RFIC_RL/virtuoso_engine/config.yaml"
output_dir:      "/disk/mcao53/Sim_engine_results/ml_filter_results_try_2"

# -----------------------------------------------------------------------------
# GRID / DESIGN SPACE
# Mirrors the SA/GA config structure.
# -----------------------------------------------------------------------------
grid:
  rows:              20
  cols:              22
  n_switches:        4
  n_switches_min:    2    # ML feasibility: minimum allowed switch count
  n_switches_max:    6    # ML feasibility: maximum allowed switch count
  max_inductors:     15
  n_states:          2
  cap_min:           200.0e-15   # 200 fF
  cap_max:           1000.0e-15  # 1 pF
  n_inductor_values: 4           # entries in the inductor_translation_table

# -----------------------------------------------------------------------------
# FILTER TARGET SPECIFICATIONS
# Same format as SA/GA filter_specs.
# State 0: 40 GHz passband  |  State 1: 20 GHz passband
# -----------------------------------------------------------------------------
filter_specs:
  - state_index: 0
    passband: [36.0e9, 44.0e9]
    passband_min_db: -3.0
    stopband_regions:
      - [3.0e9, 35.0e9]
      - [45.0e9, 50.0e9]
    stopband_max_db: -25.0
    cross_stopband_regions:
      - [18.0e9, 22.0e9]
    cross_stopband_max_db: -25.0
    weight: 1.0

  - state_index: 1
    passband: [18.0e9, 22.0e9]
    passband_min_db: -3.0
    stopband_regions:
      - [3.0e9, 17.0e9]
      - [23.0e9, 50.0e9]
    stopband_max_db: -25.0
    cross_stopband_regions:
      - [36.0e9, 44.0e9]
    cross_stopband_max_db: -25.0
    weight: 1.0

# -----------------------------------------------------------------------------
# S-PARAMETER FREQUENCY GRID
# All ML modules interpolate Touchstone files onto this canonical grid.
# -----------------------------------------------------------------------------
s_param:
  freq_min: 0.0e9     # 1 GHz
  freq_max: 50.0e9    # 50 GHz
  n_freq:   101       # number of uniformly spaced points

# -----------------------------------------------------------------------------
# ENCODING
# Gap between pixel-type regions in the [0,1] float encoding.
# -----------------------------------------------------------------------------
encoding:
  region_gap: 0.05

# -----------------------------------------------------------------------------
# GENERATIVE MODEL (conditional diffusion model)
# -----------------------------------------------------------------------------
generative_model:
  cond_dim:       256     # S-param conditioning vector dimension
  t_dim:          128     # time embedding dimension
  base_channels:  64      # U-Net first-stage channel count
  n_ddim_steps:   100      # DDIM inference steps at inference
  guidance_scale: 2.0     # classifier-free guidance scale (1.0 = no guidance)
  p_uncond:       0.1     # CFG null-conditioning dropout probability
  lr:             1.0e-4
  batch_size:     32
  T:              1000    # diffusion timesteps
  beta_start:     1.0e-4
  beta_end:       0.02

# -----------------------------------------------------------------------------
# WORLD MODEL (ensemble surrogate)
# -----------------------------------------------------------------------------
world_model:
  n_members:            5
  lr:                   1.0e-4
  batch_size:           32
  std_scale:            3.0     # dB — calibration for confidence score
  confidence_threshold:      0.75   # final threshold after schedule (above → relabel)
  confidence_schedule_iters: 200  # iters to ramp from 1.0 → confidence_threshold
  use_bagging:               true  # each member trains on random 80% of batch
  correction_interval:  5      # run Step 5 every N iterations

# -----------------------------------------------------------------------------
# REPLAY BUFFER
# -----------------------------------------------------------------------------
replay_buffer:
  max_size:           10000
  alpha_recency:      0.6       # weight for recency term in priority
  alpha_real:         0.4       # weight for real-data bonus term
  real_bonus:         2.0       # additive bonus for real simulation entries
  decay_rate:         0.05      # exponential decay rate for recency
  infeasible_weight:        0.1   # priority multiplier for infeasible entries
  infeasible_min_fraction:  0.2  # guaranteed infeasible fraction per gen training batch

# -----------------------------------------------------------------------------
# TRAINING LOOP
# -----------------------------------------------------------------------------
training:
  warmup_n_designs:                   200   # number of random designs to simulate at warmup
  warmup_n_random_feasible:          5000   # random feasible layouts for unconditional pretraining (no sim)
  warmup_random_feasible_train_steps:  200   # gen model train steps on those layouts
  n_iterations:          500    # total online training iterations
  n_gen_samples:         20     # designs sampled from gen model per iteration
  n_sim_max:             10      # max new real simulations per iteration
  gen_train_steps:          5   # Adam steps for generative model per iteration
  wm_train_steps:           5   # Adam steps for world model per iteration
  wm_correction_n:           5   # high-confidence entries to re-simulate in Step 5
  max_resample_attempts:    5   # retries to get feasible decoded design
  max_infeasible_per_iter:   10   # max infeasible samples added to buffer per iteration

# -----------------------------------------------------------------------------
# PARALLEL SIMULATION
# -----------------------------------------------------------------------------
parallel:
  num_workers: 5

# -----------------------------------------------------------------------------
# DDPO FINE-TUNING
# RL-based fine-tuning of the diffusion model using world model feedback.
# -----------------------------------------------------------------------------
ddpo:
  n_steps:            100      # stochastic DDPM steps per DDPO trajectory
  batch_size:         32       # designs sampled per DDPO iteration
  interval:           1       # run DDPO every N online training iterations
  infeasible_penalty: 1.0     # reward penalty multiplier per rule violation
  eta:                0.5     # stochasticity: 1.0=full DDPM, 0.0=DDIM (invalid for DDPO)

# -----------------------------------------------------------------------------
# GUIDANCE MODE
# Controls how the diffusion model is conditioned during sampling and training.
#
# "s_param"     : condition on an ideal target S-parameter curve (default).
#                 Stable and interpretable, but may target unrealizable responses.
#
# "score_based" : condition on four decomposed penalty scores per filter state:
#                   [lower_reject, passband, higher_reject, cross_band]
#                 The trainer tracks the best scores seen in real simulations and
#                 guides toward a slightly better target (gradual curriculum).
#                 When this mode is active, the warmup buffer is always rebuilt
#                 from the sim folder so spec changes are reflected immediately.
# -----------------------------------------------------------------------------
guidance:
  mode:               "score_based"   # "s_param" or "score_based"
  improvement_factor: 0.90        # target = best_seen_scores × factor (score_based only)
  n_score_components: 4           # [lower_reject, passband, higher_reject, cross_band]

# -----------------------------------------------------------------------------
# CHECKPOINTING
# -----------------------------------------------------------------------------
checkpoint_interval: 50   # save checkpoint every N iterations

# Optional: set seed for reproducibility (null = random)
seed: 42

# Debug: print pixel-type counts for every generated design in Step 1
debug: true
