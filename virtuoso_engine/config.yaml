# ============================================================
# Virtuoso Pixel Engine — pixel_size=25 um, grid_size=20 um
# Single inductor: layout-extracted EM s1p (300 pH active inductor).
#
# Inherits all shared settings from config_base.yaml.
# ============================================================
_base_: config_base.yaml

layout:
  pixel_size: 25.0   # um
  grid_size:  20.0   # um  (pixel_size > grid_size → overlapping pixels)

pixelated:
  # Single-value inductor translation table — layout-extracted EM s1p
  inductor_translation_table:
    - "Inductor_spar/Ind_from_layout/Active_inductor_300pH_EM_on.s1p"

  # Example values — overridden per run by the optimizer
  inductor_values: [0]
  inductor_s1p: "Inductor_spar/Ind_from_layout/Active_inductor_300pH_EM_on.s1p"

  # OFF-state layout-extracted EM s1p (replaces large-resistor open-circuit model)
  inductor_off_translation_table:
    - "Inductor_spar/Ind_from_layout/Active_inductor_300pH_EM_off.s1p"

  inductor_off_s1p: "Inductor_spar/Ind_from_layout/Active_inductor_300pH_EM_off.s1p"
