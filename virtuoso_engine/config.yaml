# ============================================================
# Virtuoso Pixel Engine — pixel_size=25 um, grid_size=20 um
# 4-inductor translation table (100/200/400/800 nH)
#
# Inherits all shared settings from config_base.yaml.
# ============================================================
_base_: config_base.yaml

layout:
  pixel_size: 25.0   # um
  grid_size:  20.0   # um  (pixel_size > grid_size → overlapping pixels)

pixelated:
  # Full 4-value inductor translation table
  inductor_translation_table:
    - "/disk/mcao53/RFIC_RL/Inductor_spar/Simulated_Active_inductance/100nH_active_inductance.s1p"
    - "/disk/mcao53/RFIC_RL/Inductor_spar/Simulated_Active_inductance/200nH_active_inductance.s1p"
    - "/disk/mcao53/RFIC_RL/Inductor_spar/Simulated_Active_inductance/400nH_active_inductance.s1p"
    - "/disk/mcao53/RFIC_RL/Inductor_spar/Simulated_Active_inductance/800nH_active_inductance.s1p"

  # Example values — overridden per run by the optimizer
  inductor_values: [1, 2]
  inductor_s1p: "/disk/mcao53/RFIC_RL/Inductor_spar/Simulated_Active_inductance/200nH_active_inductance.s1p"
