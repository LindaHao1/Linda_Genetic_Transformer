# ============================================================
# Virtuoso Pixel Engine — Base Configuration
#
# This file contains all settings that are shared across pixel-size variants.
# It is not meant to be used directly; instead, create a variant config that
# sets _base_: config_base.yaml and overrides:
#   layout.pixel_size, layout.grid_size
#   pixelated.inductor_translation_table, inductor_values, inductor_s1p
#
# Example:
#   _base_: config_base.yaml
#   layout:
#     pixel_size: 31.0
#     grid_size:  25.0
# ============================================================

mode: "pixelated_design_simple"

# ============================================================
# PROJECT SETTINGS
# ============================================================
project:
  lib_name: "pySim"
  pdk_lib: "tsmcN65"
  parent_output_dir: "/disk/mcao53/Sim_engine_results/pixel_results"
  virtuoso_dir: "/disk/mcao53/Sim_engine_results"
  display: ":99"

# ============================================================
# TUNABLE PARAMETERS — layout_pixel mode
# ============================================================
nmos:
  width: "2u"
  length: "60n"
  fingers: 32
  cell_layout: "nmos_rf"
  cell_spectre: "nmos_rf"

mim_cap:
  length: "12u"
  width: "12u"
  total_c: "1p"
  mimflag: 3
  mismatchflag: 0
  cell_layout: "mimcap_um_rf"
  cell_spectre: "mimcap_um_sin_rf"

# ============================================================
# TUNABLE PARAMETERS — simplified_pixel mode
# ============================================================
switch_model:
  cap_value: "1e-12"
  switch_on_s1p: "/disk/mcao53/RFIC_RL/Switch_spar/Switch_128um_on.s1p"
  switch_off_s1p: "/disk/mcao53/RFIC_RL/Switch_spar/Switch_128um_off.s1p"

# ============================================================
# LAYOUT GEOMETRY — pixel_size and grid_size must be set in child configs
# ============================================================
layout:
  pixel_size: null   # um — MUST be overridden in child config
  grid_size:  null   # um — MUST be overridden in child config
  gnd_layer: "M4"
  pixel_layer: "AP"
  via_size: 3.8
  gnd_y_extension: 10.0

# ============================================================
# SIMULATION
# ============================================================
simulation:
  control_voltages: [1.0, 0.0]
  emx_freq_start: 0
  emx_freq_stop: "70e9"
  emx_freq_step: "1e9"
  emx_parallel_threads: 8
  spectre_freq_start: "0G"
  spectre_freq_stop: "70G"
  spectre_freq_step: "1G"

# ============================================================
# PIXELATED DESIGN — template values (overridden per run by the optimizer)
# inductor_translation_table, inductor_values, inductor_s1p
# must be set in child configs.
# ============================================================
pixelated:
  pixel_state_matrix:
    - [1, 1, 2, 1, 0]
    - [0, 3, 1, 3, 1]
    - [0, 0, 2, 1, 0]

  # state_list format: List[List[List[int]]]
  #   outer = filter states, middle = switch pixels (row-major), inner = on/off bits per cap in bank.
  # Each inner list corresponds to one switch's capacitor bank; all banks for the same switch
  # share the same EMX port (SW_i) and their cap+switch pairs are connected in parallel.
  # Legacy flat format [[0,0],[1,0],...] is auto-normalized to [[[0],[0]],[[1],[0]],...].
  state_list:
    - [[0], [0]]
    - [[1], [0]]
    - [[0], [1]]
    - [[1], [1]]

  # cap_values format: List[List[float]]
  #   outer = switch pixels (row-major), inner = capacitance values (F) per cap in bank.
  # Legacy flat format [1e-12, 1e-12] is auto-normalized to [[1e-12], [1e-12]].
  cap_values:
    - [1.0e-12]
    - [1.0e-12]

  feedline:
    feedline_row: 1
    feedline_width: 10.2
    feedline_padding: 10.0

  inductor_translation_table: []   # MUST be overridden in child config
  inductor_values: []              # MUST be overridden in child config
  inductor_s1p: ""                 # MUST be overridden in child config

  # Optional OFF-state s1p files.  When provided, an inductor in the OFF state
  # is terminated with its layout-extracted s1p instead of a large resistor.
  # inductor_off_translation_table mirrors inductor_translation_table (same
  # value indices).  inductor_off_s1p is a single fallback for all inductors.
  # Leave both empty (or omit) to keep the original large-resistor behaviour.
  inductor_off_translation_table: []
  inductor_off_s1p: ""

  inductor_cap_values: []

  cap_pixel_pairs: []
  cap_pair_values: []

# ============================================================
# FULL LAYOUT MODE
# This section is only used when mode: "full_layout".
# All other modes are unaffected when this section is present.
# ============================================================
full_layout:
  # Cell identity — manually specified (not auto-generated)
  lib_name: "pySim"
  cell_name: "full_layout_test"

  # Layout geometry inherits layout.pixel_size / layout.grid_size
  # Design fields (pixel_state_matrix, switch_cap_values, cap_pixel_pairs,
  # cap_pair_values, feedline) live in the pixelated: section so configs
  # are shared between pixelated_design_simple and full_layout modes.

  # Inductors: lib/cell of an existing Virtuoso layout cell to duplicate
  # Leave empty until the real inductor cell is available.
  inductor_lib: "Doherty_design"
  inductor_cell: "Activeinductance_Gyratorbased_200pH_v1"
  # Offset applied after aligning the inductor IN pin to the pixel centre [x, y] in um
  inductor_offset: [-80.0, 50.0]

  # Lookup tables (relative to repo root or absolute paths)
  switch_cap_table: "virtuoso_engine/data/switch_cap_table.csv"
  cap_pair_table:   "virtuoso_engine/data/cap_pair_table.csv"

  # Via pixel dimensions, for switch design
  via_size: 3.8              # square via size (um)

  # Layer configuration — null fields inherit from layout.gnd_layer / layout.pixel_layer
  layers:
    gnd_layer: null                      # null → use layout.gnd_layer
    pixel_layer: null                    # null → use layout.pixel_layer
    switch_drain_via: ["M2", "M8"]       # drain via stack (bottom, top)
    switch_bulk_via:  ["M1", "M4"]       # bulk connection via
    switch_mim_via:   ["M8", "M9"]       # MIM cap minus-side via
    cap_pair_route: null                 # null → same as pixel_layer
    via_pixel_stack: ["M4", "AP"]        # type-4 via: full stack from gnd to top metal

  # Wire width (um) for M8 routing paths in cap pair connections
  cap_pair_wire_width: 1.0

# ============================================================
# CLEANUP
# ============================================================
cleanup:
  delete_intermediate_files: false

# ============================================================
# PARALLEL ENGINE
# ============================================================
parallel:
  num_workers: 2

# ============================================================
# FIXED PATHS
# ============================================================
paths:
  proc_file: "/disk/mcao53/Project65/proc65/RC_IRCX_CRN65G+_1P9M+UT-ALRDL_6X1Z1U_MiM_typical.proc"
  tsmc_models: "/disk/TSMC65GP_PDK/MSRF_General_Purpose_Plus/PDK/CadenceOA/tn65cmsp018k3_1_0c/models/spectre/crn65gplus_2d5_lk_v1d0.scs"
  emx_binary: "/cae/apps/data/cadence-2025/installs/EMX20251/bin/emx"
