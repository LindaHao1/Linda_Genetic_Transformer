# ===========================================================================
# GA Experiment — 21×27 → larger grid, pixel_size=31 um, grid_size=25 um
# Expand a known-good 21×27 ps31/gs25 design to the target grid size by
# physically inserting rows/columns, then fine-tune the expanded population.
#
# Differs from ps31_gs25_finetune_from_large.yaml: instead of seeding the
# population by mutating the small design directly within the larger grid,
# each seeded individual is first physically expanded (rows/columns inserted)
# before mutations are applied.  This gives a structurally valid starting
# point at the target grid size rather than relying on flip_inner_region logic.
#
# IMPORTANT: set ga.finetune_design_path before running.
# ===========================================================================
_base_: ../base/finetune_3_states.yaml

virtuoso_config: "/disk/mcao53/RFIC_RL/virtuoso_engine/config_ps31_gs25.yaml"
output_dir: "/disk/mcao53/Sim_engine_results/ga_filter_results_ps31_gs25_expand_to_large_update_cap_model_count"

grid:  
  n_states: 3
  rows: 30       # TODO: adjust to target large-grid size
  cols: 33      # TODO: adjust to target large-grid size

ga:
  finetune_design_path: "/disk/mcao53/RFIC_RL/candidate_design/new_cap_model/sim_20260427_132241_config.yaml"
  n_parallel: 6
  finetune_expand:
    enabled: true

    # Fraction of pop_size_start generated completely at random (no seed).
    p_completely_random: 0.4

    # Mutations applied to each seeded individual at init (uniform draw 1..N).
    init_max_mutations: 5

    # Top-level mode weights for the seeded fraction (treated as weights, need not sum to 1):
    #   p_embed:             embed seed at center; outside pixels filled with a random
    #                        density d ~ Uniform(embed_density_min, embed_density_max) drawn each call
    #   p_random_insertion:  insert rows/cols one at a time using sub-modes below
    p_embed:             0.6
    p_random_insertion:  0.0

    # Density range for p_embed background pixels (d=0 → zeros, d=1 → all-ones).
    embed_density_min: 0.6
    embed_density_max: 1.0

    # If true, individual 0 is always a zero-padded embed of the seed (no mutations).
    # Set to false to draw individual 0 from the normal expand distribution instead.
    zero_pad_first: false

    # Sub-mode weights for p_random_insertion (treated as weights, need not sum to 1):
    #   p_duplicate:   copy the adjacent row/col at a random interior position
    #   p_random_fill: random 0/1 content at a random interior position
    #   p_zero_pad:    zeros inserted at the boundary edges only (not interior)
    p_duplicate:   1.0
    p_random_fill: 0.1
    p_zero_pad:    0.0
    n_immigrants_expanded: 4   # expanded immigrants injected each generation

seed: 42
