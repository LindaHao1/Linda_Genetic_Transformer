# ===========================================================================
# Experiment — Differential Filter, 21x27 HALF grid, SCRATCH co-optimization
#              with SERIES CAP PAIRS + SHUNT CAPS
#
# Co-optimizes, simultaneously, on the HALF design (engine mirrors to 41x27):
#   * pixel metal 0/1   (flip_01)
#   * vias              (flip_via, type-4 pixels)
#   * series MIM cap pairs   (add / remove / perturb_pair_caps) — on the metal
#   * shunt capacitors       (modify_shunt_cap / perturb_shunt_caps, type-5)
#
# Both capacitor mechanisms are mirrored to the bottom half (same values), so
# the simulated 41x27 layout stays electrically symmetric.
#
# Regular scratch run.  To fine-tune from an implemented design instead, set
# ga.finetune_design_path (inherited from base_differential.yaml).
# ===========================================================================

_base_: ./base_differential.yaml

virtuoso_config: "/disk/mcao53/RFIC_RL/virtuoso_engine/config_differential.yaml"
output_dir: "/disk/mcao53/Sim_engine_results/ga_differential_21x27_scratch_cap_both"

layout:
  pixel_size: 12.5   # um — metal patch size must include .0 if integer
  grid_size:  10.0   # um — pixel pitch (the GA reads this for connectivity)

grid:
  rows: 21   # HALF-design rows — engine mirrors to 41 rows
  cols: 27

  # Vias on (low-frequency suppression).
  n_max_vias:    3
  init_min_vias: 0
  init_max_vias: 2

  # --- Series cap pairs ON TOP of the metal (co-optimized from scratch) ---
  enable_cap_pairs:  true
  max_cap_pairs:     8           # upper bound on simultaneous cap pairs (half design)
  cap_pair_init_min: 0           # random init seeds 0..6 cap pairs per individual
  cap_pair_init_max: 6
  cap_pair_min:      50.0e-15    # 50 fF
  cap_pair_max:      1000.0e-15  # 1000 fF
  cap_pair_sigma:    50.0e-15    # perturbation step for perturb_pair_caps
  cap_pair_min_dist: 2           # Chebyshev pixel distance between endpoints
  cap_pair_max_dist: 3
  cap_pair_axis_aligned: true    # only horizontal/vertical pairs

  # --- Shunt-capacitor pixels (type 5), co-optimized from scratch ---
  enable_shunt_caps:  true
  max_shunt_caps:     8           # upper bound on simultaneous shunt caps (half design)
  min_shunt_caps:     0
  shunt_cap_init_min: 0           # random init seeds 0..6 shunt caps per individual
  shunt_cap_init_max: 6
  shunt_cap_min:      50.0e-15    # 50 fF
  shunt_cap_max:      1000.0e-15  # 1000 fF
  shunt_cap_sigma:    50.0e-15    # perturbation step for perturb_shunt_caps

seed: 42

ga:
  via_flip_max_count: 1
  # action_weights deep-merges with the base — only the changed keys here.
  action_weights:
    flip_01:            6.0
    flip_via:           2.0
    add_cap_pair:       4.0
    remove_cap_pair:    4.0
    perturb_pair_caps:  4.0
    modify_shunt_cap:   4.0
    perturb_shunt_caps: 4.0
  exploitation_action_weights:
    flip_01:            2.0
    flip_via:           2.0
    add_cap_pair:       2.0
    remove_cap_pair:    2.0
    perturb_pair_caps:  6.0
    modify_shunt_cap:   2.0
    perturb_shunt_caps: 6.0
