# ===========================================================================
# Experiment — Differential Filter, 21x27 HALF grid, MULTI-LAYER metal
#              + SHUNT CAPS, warm-start from best design of
#              ga_differential_21x27_multilayer_shunt_cap (gen74_ind18)
# ===========================================================================

_base_: ./base_differential.yaml

virtuoso_config: "/volumes/research-localdata/mcao53/RFIC_RL/virtuoso_engine/config_differential.yaml"
output_dir: "/volumes/research-localdata/mcao53/Sim_engine_results/ga_differential_21x27_shunt_cap_v2"

layout:
  pixel_size: 12.5
  grid_size:  10.0

grid:
  rows: 21
  cols: 27

  enable_multi_layer: true
  allowed_layers: [0, 1, 2]

  enable_cap_pairs: false
  max_cap_pairs:    0

  enable_shunt_caps:  true
  max_shunt_caps:     8
  min_shunt_caps:     0
  shunt_cap_init_min: 0
  shunt_cap_init_max: 6
  shunt_cap_min:      50.0e-15
  shunt_cap_max:      1000.0e-15
  shunt_cap_sigma:    50.0e-15

seed: 42

ga:
  action_weights:
    flip_01:            6.0
    modify_shunt_cap:   4.0
    perturb_shunt_caps: 4.0
  exploitation_action_weights:
    flip_01:            2.0
    modify_shunt_cap:   2.0
    perturb_shunt_caps: 6.0

  finetune_design_path: "/volumes/research-localdata/mcao53/Sim_engine_results/ga_differential_21x27_multilayer_shunt_cap/sims/gen74_ind18/worker_4/diff_r21c27_ps12p5_gs10p0_x6de83d_w4/config.yaml"
  finetune_expand:
    enabled: true
    p_completely_random: 0.3
    init_max_mutations:  12
    zero_pad_first:      true
    n_immigrants_expanded: 5
