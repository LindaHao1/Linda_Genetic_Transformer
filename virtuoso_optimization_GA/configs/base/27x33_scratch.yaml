# ===========================================================================
# GA Base Config — 27×33 Grid, Scratch (from-random) Initialisation
#
# This file is a SHARED BASE — do not run it directly.
# Create an experiment config in configs/27x33/ that sets:
#   _base_: ../base/27x33_scratch.yaml
#   virtuoso_config: "/disk/mcao53/RFIC_RL/virtuoso_engine/config_<variant>.yaml"
#   output_dir: "/disk/mcao53/Sim_engine_results/<experiment_name>"
#   seed: 42
#
# Three-state switchable filter:
#   State 0: passband at  7 GHz  ( 6– 8 GHz)
#   State 1: passband at 24 GHz  (22–26 GHz)
#   State 2: passband at 40 GHz  (38–42 GHz)
#
# Compared to 21x27_scratch.yaml, this base uses:
#   - Larger population over more generations (pop 70→30, 300 gen)
#   - Stronger filter weights (passband_weight=4, cost_order=1.5, spurious=true)
#   - Axis-aligned cap pairs only
#   - Spatially-biased flip_01 mutation (flip_inner_region)
# ===========================================================================

# ---------------------------------------------------------------------------
# GRID / DESIGN SPACE
# ---------------------------------------------------------------------------
grid:
  rows: 27
  cols: 33
  n_states: 3

  min_switches: 2
  max_switches: 6
  max_inductors: 10
  n_max_vias: 5

  init_min_switches: 2
  init_max_switches: 4
  init_min_inductors: 4
  init_max_inductors: 8
  init_min_vias: 0
  init_max_vias: 2

  cap_min: 200.0e-15
  cap_max: 1000.0e-15

  n_inductor_values: 1
  single_inductor_value: true

  enable_cap_pairs:      true
  max_cap_pairs:         8
  cap_pair_init_min:     0
  cap_pair_init_max:     4
  cap_pair_min:          50.0e-15
  cap_pair_max:          1000.0e-15
  cap_pair_sigma:        50.0e-15
  cap_pair_min_dist:     2
  cap_pair_max_dist:     3
  cap_pair_axis_aligned: true        # horizontal/vertical pairs only

# ---------------------------------------------------------------------------
# FILTER TARGET SPECIFICATIONS  (7 / 24 / 40 GHz — stronger penalty weights)
# ---------------------------------------------------------------------------
filter_specs:
  - state_index:     0
    passband:        [6.0e9, 8.0e9]
    passband_min_db: -0.0
    stopband_regions:
      - [4.0e9,   6.0e9]
      - [8.0e9,  14.0e9]
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 4.0
    stopband_weight: 2.0
    cross_stopband_regions:
      - [14.0e9, 65.0e9]
    cross_stopband_max_db: -20.0
    cross_stopband_weight: 1.0
    enable_s11_cost:           true
    s11_passband_max_db:       -20.0
    s11_stopband_min_db:       -0.0
    s11_cross_stopband_min_db: -0.0
    cost_order: 1.5
    enable_peak_matching:         false
    peak_matching_threshold:      0.20
    peak_matching_max_multiplier: 2.0
    enable_spurious_peak_penalty: true
    spurious_peak_max_db:        -10.0
    spurious_peak_weight:          1.0

  - state_index:     1
    passband:        [22.0e9, 26.0e9]
    passband_min_db: -0.0
    stopband_regions:
      - [14.0e9, 22.0e9]
      - [26.0e9, 32.0e9]
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 4.0
    stopband_weight: 2.0
    cross_stopband_regions:
      - [4.0e9,  14.0e9]
      - [32.0e9, 65.0e9]
    cross_stopband_max_db: -20.0
    cross_stopband_weight: 1.0
    enable_s11_cost:           true
    s11_passband_max_db:       -20.0
    s11_stopband_min_db:       -0.0
    s11_cross_stopband_min_db: -0.0
    cost_order: 1.5
    enable_peak_matching:         false
    peak_matching_threshold:      0.20
    peak_matching_max_multiplier: 2.0
    enable_spurious_peak_penalty: true
    spurious_peak_max_db:        -10.0
    spurious_peak_weight:          1.0

  - state_index:     2
    passband:        [38.0e9, 42.0e9]
    passband_min_db: -0.0
    stopband_regions:
      - [32.0e9, 38.0e9]
      - [42.0e9, 50.0e9]
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 4.0
    stopband_weight: 2.0
    cross_stopband_regions:
      - [4.0e9,  32.0e9]
      - [50.0e9, 65.0e9]
    cross_stopband_max_db: -20.0
    cross_stopband_weight: 1.0
    enable_s11_cost:           true
    s11_passband_max_db:       -20.0
    s11_stopband_min_db:       -0.0
    s11_cross_stopband_min_db: -0.0
    cost_order: 1.5
    enable_peak_matching:         false
    peak_matching_threshold:      0.20
    peak_matching_max_multiplier: 2.0
    enable_spurious_peak_penalty: true
    spurious_peak_max_db:        -10.0
    spurious_peak_weight:          1.0

# ---------------------------------------------------------------------------
# GENETIC ALGORITHM PARAMETERS
# ---------------------------------------------------------------------------
ga:
  pop_size_start: 70
  pop_size_end:   30
  pop_size_step_size: 10
  pop_schedule_gens_per_step: 1
  elite_fraction:  0.20
  n_gen:    300
  n_immigrants: 3
  n_keep_bad:  0

  p_crossover: 0.7
  p_mutation:  0.5
  crossover_method: "hybrid"
  hybrid_method_weights: [1.0, 1.0, 1.0]
  n_centroids: 5
  block_min_size: 10
  block_max_size: 25

  selection:       "tournament"
  tournament_size: 5

  n_parallel: 3

  n_regular_flip: 25
  cap_sigma:      50.0e-15
  via_flip_max_count: 3

  action_weights:
    flip_01:             8.0
    modify_switch:       3.0
    flip_inductor:       1.0
    flip_inductor_value: 0.0
    perturb_caps:        2.0
    flip_switch_state:   8.0
    add_cap_pair:        8.0
    remove_cap_pair:     8.0
    perturb_pair_caps:   2.0
    flip_inductor_state: 8.0
    flip_via:            1.0

  use_state_champions: true
  p_champion_parent:  0.4
  p_champion_parent2: 0.3
  n_state_champions:  2
  dynamic_state_assignment: true

  exploitation_n: 5
  exploitation_action_weights:
    flip_01:             4.0
    modify_switch:       4.0
    flip_inductor:       0.0
    flip_inductor_value: 0.0
    perturb_caps:        0.0
    flip_switch_state:   4.0
    add_cap_pair:        4.0
    remove_cap_pair:     4.0
    perturb_pair_caps:   2.0
    flip_inductor_state: 4.0
    flip_via:            1.0

  # Spatially-biased flip_01: preserve the active design area (rows 3-23, cols 4-28)
  # and allow freer mutations in the zero-padded surround.
  flip_region_size: 8
  flip_inner_region: [[3, 4], [23, 28]]
  flip_inner_prob:   0.5
  flip_outer_prob:   0.5

  feasibility_cost_threshold: 1.0e6
  population_plot_top_k: 5
