# ===========================================================================
# GA Base Config — 27×33 Grid, Fine-Tune Initialisation
#
# Inherits grid, filter_specs, and most GA params from 27x33_scratch.yaml.
# Overrides population schedule and action weights for fine-tune exploitation,
# and enables fine-tune seeding with outer-region-only initialisation.
#
# This file is a SHARED BASE — do not run it directly.
# Create an experiment config in configs/27x33/ that sets:
#   _base_: ../base/27x33_finetune.yaml
#   virtuoso_config: "/disk/mcao53/RFIC_RL/virtuoso_engine/config_<variant>.yaml"
#   output_dir: "/disk/mcao53/Sim_engine_results/<experiment_name>"
#   ga:
#     finetune_design_path: "/path/to/best_design.yaml"  # REQUIRED
#   seed: 42
# ===========================================================================
_base_: 27x33_scratch.yaml

ga:
  pop_size_start: 50
  pop_size_end:   30
  pop_size_step_size: 10
  pop_schedule_gens_per_step: 1
  n_immigrants: 3
  n_keep_bad:  0
  p_mutation:  0.5

  # Fine-tune initialisation: each seeded individual is produced by applying
  # 1..finetune_init_max_mutations random mutations to the seed design.
  # finetune_init_outer_only=true restricts flip_01 at init to outer pixels only.
  finetune_init_max_mutations: 5
  finetune_init_outer_only:    true

  # Fine-tune: seed finetune_seed_ratio of the initial population by
  # mutating an existing design.  The remaining fraction is random.
  # finetune_design_path MUST be set to a valid path in the experiment config.
  finetune_design_path: null   # REQUIRED — set this in your experiment config
  finetune_seed_ratio:  0.7
