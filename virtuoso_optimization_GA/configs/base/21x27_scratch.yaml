# ===========================================================================
# GA Base Config — 21×27 Grid, Scratch (from-random) Initialisation
#
# This file is a SHARED BASE — do not run it directly.
# Create an experiment config in configs/21x27/ that sets:
#   _base_: ../base/21x27_scratch.yaml
#   virtuoso_config: "/disk/mcao53/RFIC_RL/virtuoso_engine/config_<variant>.yaml"
#   output_dir: "/disk/mcao53/Sim_engine_results/<experiment_name>"
#   seed: 42
#
# Three-state switchable filter:
#   State 0: passband at  7 GHz  ( 6– 8 GHz)
#   State 1: passband at 24 GHz  (22–26 GHz)
#   State 2: passband at 40 GHz  (38–42 GHz)
# ===========================================================================

# ---------------------------------------------------------------------------
# GRID / DESIGN SPACE
# ---------------------------------------------------------------------------
grid:
  rows: 21
  cols: 27
  n_states: 3

  # --- Feasibility constraints ---
  min_switches: 2
  max_switches: 6
  max_inductors: 10
  n_max_vias: 5

  # --- Initialisation ranges ---
  init_min_switches: 4
  init_max_switches: 6
  init_min_inductors: 4
  init_max_inductors: 8
  init_min_vias: 0
  init_max_vias: 2

  # Switch series capacitance range (Farads)
  cap_min: 200.0e-15    # 200 fF
  cap_max: 1000.0e-15   # 1000 fF

  # Inductor settings — override n_inductor_values in experiment config
  # to match the engine's inductor_translation_table length.
  n_inductor_values: 1
  single_inductor_value: true

  # --- Cap pixel pairs ---
  enable_cap_pairs:  true
  max_cap_pairs:     8
  cap_pair_init_min: 0
  cap_pair_init_max: 4
  cap_pair_min:      50.0e-15    # 50 fF
  cap_pair_max:      1000.0e-15  # 1000 fF
  cap_pair_sigma:    50.0e-15
  cap_pair_min_dist: 2
  cap_pair_max_dist: 3

# ---------------------------------------------------------------------------
# FILTER TARGET SPECIFICATIONS  (7 / 24 / 40 GHz)
# ---------------------------------------------------------------------------
filter_specs:
  - state_index:     0
    passband:        [6.0e9, 8.0e9]
    passband_min_db: -0.0
    stopband_regions:
      - [4.0e9,   6.0e9]
      - [8.0e9,  14.0e9]
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 6.0
    stopband_weight: 1.0
    cross_stopband_regions:
      - [14.0e9, 65.0e9]
    cross_stopband_max_db: -20.0
    cross_stopband_weight: 1.0
    enable_s11_cost:           true
    s11_passband_max_db:       -20.0
    s11_stopband_min_db:       -0.0
    s11_cross_stopband_min_db: -0.0
    cost_order: 1.0
    enable_peak_matching:         false
    peak_matching_threshold:      0.20
    peak_matching_max_multiplier: 2.0
    enable_spurious_peak_penalty: true
    spurious_peak_max_db:        -10.0
    spurious_peak_weight:          1.0

  - state_index:     1
    passband:        [22.0e9, 26.0e9]
    passband_min_db: -0.0
    stopband_regions:
      - [14.0e9, 22.0e9]
      - [26.0e9, 32.0e9]
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 6.0
    stopband_weight: 1.0
    cross_stopband_regions:
      - [4.0e9,  14.0e9]
      - [32.0e9, 65.0e9]
    cross_stopband_max_db: -20.0
    cross_stopband_weight: 1.0
    enable_s11_cost:           true
    s11_passband_max_db:       -20.0
    s11_stopband_min_db:       -0.0
    s11_cross_stopband_min_db: -0.0
    cost_order: 1.0
    enable_peak_matching:         false
    peak_matching_threshold:      0.20
    peak_matching_max_multiplier: 2.0
    enable_spurious_peak_penalty: true
    spurious_peak_max_db:        -10.0
    spurious_peak_weight:          1.0

  - state_index:     2
    passband:        [38.0e9, 42.0e9]
    passband_min_db: -0.0
    stopband_regions:
      - [32.0e9, 38.0e9]
      - [42.0e9, 50.0e9]
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 6.0
    stopband_weight: 1.0
    cross_stopband_regions:
      - [4.0e9,  32.0e9]
      - [50.0e9, 65.0e9]
    cross_stopband_max_db: -20.0
    cross_stopband_weight: 1.0
    enable_s11_cost:           true
    s11_passband_max_db:       -20.0
    s11_stopband_min_db:       -0.0
    s11_cross_stopband_min_db: -0.0
    cost_order: 1.0
    enable_peak_matching:         false
    peak_matching_threshold:      0.20
    peak_matching_max_multiplier: 2.0
    enable_spurious_peak_penalty: true
    spurious_peak_max_db:        -10.0
    spurious_peak_weight:          1.0

# ---------------------------------------------------------------------------
# GENETIC ALGORITHM PARAMETERS
# ---------------------------------------------------------------------------
ga:
  pop_size_start:    200
  pop_size_end:       40
  pop_size_step_size: 20
  elite_fraction:   0.20
  n_gen:    100
  n_immigrants: 2
  n_keep_bad:  1

  p_crossover: 0.7
  p_mutation:  0.7
  crossover_method: "hybrid"
  hybrid_method_weights: [1.0, 1.0, 1.0]
  n_centroids: 4
  block_min_size: 10
  block_max_size: 20

  selection:       "tournament"
  tournament_size: 5

  n_parallel: 5

  n_regular_flip: 25
  cap_sigma:      50.0e-15
  via_flip_max_count: 3

  action_weights:
    flip_01:             4.0
    modify_switch:       2.0
    flip_inductor:       1.0
    flip_inductor_value: 2.0
    perturb_caps:        4.0
    flip_switch_state:   8.0
    add_cap_pair:        4.0
    remove_cap_pair:     4.0
    perturb_pair_caps:   4.0
    flip_inductor_state: 8.0
    flip_via:            2.0

  use_state_champions: true
  p_champion_parent:  0.5
  p_champion_parent2: 0.25
  dynamic_state_assignment: true

  exploitation_n: 5
  exploitation_action_weights:
    flip_01:             0.0
    modify_switch:       4.0
    flip_inductor:       0.0
    flip_inductor_value: 0.0
    perturb_caps:        4.0
    flip_switch_state:   4.0
    add_cap_pair:        0.0
    remove_cap_pair:     0.0
    perturb_pair_caps:   4.0
    flip_inductor_state: 4.0
    flip_via:            2.0

  feasibility_cost_threshold: 1.0e6
  population_plot_top_k: 5
