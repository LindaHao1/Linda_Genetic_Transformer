ga:
  # Smaller population for fine-tune (exploiting a good starting point)
  pop_size_start:    100
  pop_size_end:       30
  pop_size_step_size: 20
  pop_schedule_gens_per_step: 2
  n_keep_bad: 1


  flip_inner_region: [[2, 6], [22, 30]]
  flip_inner_prob:   0.6
  flip_outer_prob:   1.0


  # Exploration vs. exploitation shift: heavier cap-pair mutations,
  # lighter structural mutations
  action_weights:
    flip_01:             12.0
    modify_switch:       5.0
    flip_inductor:       5.0
    flip_inductor_value: 0.0
    perturb_caps:        4.0
    flip_switch_state:   5.0
    add_cap_pair:        6.0
    remove_cap_pair:     6.0
    perturb_pair_caps:   6.0
    flip_inductor_state: 5.0
    flip_via:            2.0

  n_state_champions: 2

  # Fine-tune / expand seeding — unified via finetune_expand.
  # Set finetune_design_path in the experiment config.  When the seed is the same
  # size as the target grid, the expand path degenerates to plain fine-tune
  # (expand_design_to_size returns a copy; mutations are then applied).
  #
  # finetune_design_path MUST be set to a valid path in the experiment config.
  finetune_design_path: null   # REQUIRED — set this in your experiment config

  finetune_expand:
    enabled:             true

    # Fraction of pop_size_start generated completely at random (no seed).
    p_completely_random: 0.3

    # Mutations applied to each seeded individual at init (uniform draw 1..N).
    init_max_mutations:  1

    # Top-level mode weights for the seeded fraction (treated as weights, need not sum to 1):
    #   p_embed:            embed seed at center; outside pixels filled with random density
    #   p_random_insertion: insert rows/cols one at a time (same-size: no-op copy)
    p_embed:             0.5
    p_random_insertion:  0.5

    embed_density_min: 0.0
    embed_density_max: 1.0

    # Individual 0 is always a zero-padded embed of the seed (no mutations).
    zero_pad_first: true

    # Sub-mode weights for p_random_insertion:
    p_duplicate:   1.0
    p_random_fill: 0.1
    p_zero_pad:    0.0
    n_immigrants_expanded: 2
