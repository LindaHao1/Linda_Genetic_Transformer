# ===========================================================================
# GA Base Config — Fine-Tune Initialisation
#
# Inherits filter_specs and most GA params from scratch.yaml.
# Overrides population schedule and action weights for exploitation,
# and enables fine-tune seeding.
#
# This file is a SHARED BASE — do not run it directly.
# Create an experiment config that sets:
#   _base_: ../base/finetune.yaml
#   virtuoso_config: "/disk/mcao53/RFIC_RL/virtuoso_engine/config_<variant>.yaml"
#   output_dir: "/disk/mcao53/Sim_engine_results/<experiment_name>"
#   grid:
#     rows: <R>   # REQUIRED — grid rows
#     cols: <C>   # REQUIRED — grid cols
#   ga:
#     finetune_design_path: "/path/to/best_design.yaml"  # REQUIRED
#   seed: 42
#
# Five-state switchable filter — original 3 states listed first so the last
# two blocks can be commented out to revert to 3-state mode (also set n_states: 3):
#   State 0: passband at  7 GHz  ( 6– 8 GHz)
#   State 1: passband at 24 GHz  (22–26 GHz)
#   State 2: passband at 40 GHz  (38–42 GHz)
#   State 3: passband at 15 GHz  (13–17 GHz)  ← comment out for 3-state
#   State 4: passband at 32 GHz  (30–34 GHz)  ← comment out for 3-state
# ===========================================================================
_base_: scratch_3_states.yaml

# Override filter_specs to raise cost_order to 1.5 for all states.
# Lists are replaced wholesale by the config loader — full spec required.
filter_specs:
  - state_index:     0
    passband:        [6.0e9, 8.0e9]
    passband_min_db: -0.0
    stopband_regions:
      - [2.0e9,   5.0e9]
      - [9.0e9,  14.0e9]
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 6.0
    stopband_weight: 1.0
    cross_stopband_regions:
      - [14.0e9, 65.0e9]
    cross_stopband_max_db: -30.0
    cross_stopband_weight: 2.0
    enable_s11_cost:           false
    s11_passband_max_db:       -20.0
    s11_stopband_min_db:       -0.0
    s11_cross_stopband_min_db: -0.0
    cost_order: 1.5
    enable_peak_matching:         false
    peak_matching_threshold:      0.20
    peak_matching_max_multiplier: 2.0
    enable_spurious_peak_penalty: false
    spurious_peak_max_db:        -10.0
    spurious_peak_weight:          1.0
    enable_pv_contrast:            true
    pv_contrast_k:                 15
    pv_contrast_weight:            8.0
    pv_passband_weight:            1.0

  - state_index:     1
    passband:        [22.0e9, 26.0e9]
