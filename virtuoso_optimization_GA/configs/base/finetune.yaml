  - state_index:     4
    passband:        [30.0e9, 34.0e9]
    passband_min_db: -0.0
    stopband_regions:
      - [27.0e9, 30.0e9]
      - [34.0e9, 37.0e9]
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 6.0
    stopband_weight: 1.0
    cross_stopband_regions:
      - [2.0e9,  27.0e9]
      - [37.0e9, 65.0e9]
    cross_stopband_max_db: -30.0
    cross_stopband_weight: 2.0
    enable_s11_cost:           false
    s11_passband_max_db:       -20.0
    s11_stopband_min_db:       -0.0
    s11_cross_stopband_min_db: -0.0
    cost_order: 1.5
    enable_peak_matching:         false
    peak_matching_threshold:      0.20
    peak_matching_max_multiplier: 2.0
    enable_spurious_peak_penalty: false
    spurious_peak_max_db:        -10.0
    spurious_peak_weight:          1.0
    enable_pv_contrast:            true
    pv_contrast_k:                 15
    pv_contrast_weight:            8.0
    pv_passband_weight:            1.0

ga:
  # Smaller population for fine-tune (exploiting a good starting point)
  pop_size_start:    100
  pop_size_end:       30
  pop_size_step_size: 20
  pop_schedule_gens_per_step: 2
  n_keep_bad: 1


  flip_inner_region: [[2, 6], [22, 30]]
  flip_inner_prob:   0.6
  flip_outer_prob:   1.0


  # Exploration vs. exploitation shift: heavier cap-pair mutations,
  # lighter structural mutations
  action_weights:
    flip_01:             12.0
    modify_switch:       5.0
    flip_inductor:       5.0
    flip_inductor_value: 1.0
    perturb_caps:        1.0
    flip_switch_state:   5.0
    add_cap_pair:        8.0
    remove_cap_pair:     8.0
    perturb_pair_caps:   3.0
    flip_inductor_state: 5.0
    flip_via:            2.0

  n_state_champions: 2

  # Fine-tune: seed finetune_seed_ratio of the initial population by
  # mutating an existing design.  The remaining fraction is random.
  # finetune_design_path MUST be set to a valid path in the experiment config.
  finetune_design_path: null   # REQUIRED — set this in your experiment config
  finetune_seed_ratio:  0.7
