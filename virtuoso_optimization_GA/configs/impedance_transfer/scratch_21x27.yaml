# ===========================================================================
# Experiment — Impedance-Transformation Filter, 21x27 grid, metal-only scratch
#
# Grid shape (rows x cols) is configured HERE, not encoded in a size-named
# folder. Change rows/cols freely to try other shapes.
#
# Keep config_impedance_transfer.yaml's pixelated.feedline.feedline_row
# consistent with the grid rows below (centre row = (rows - 1) / 2).
# ===========================================================================

_base_: ./base_impedance_transfer_via.yaml

virtuoso_config: "/disk/mcao53/RFIC_RL/virtuoso_engine/config_impedance_transfer.yaml"
output_dir: "/disk/mcao53/Sim_engine_results/ga_impedance_transfer_21x27_scratch_with_via_2"

layout:
  pixel_size: 12.5   # um — metal patch size must include .0 if integer
  grid_size:  10.0   # um — pixel pitch (the GA reads this for connectivity)

grid:
  rows: 21   # grid shape — edit as needed
  cols: 27

seed: 42
