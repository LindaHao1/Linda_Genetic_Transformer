# ===========================================================================
# Experiment a — Impedance-Transformation Filter, 25x29 FINE-TUNE (metal + via)
#
# Expands the best 21x27 metal-only (+ via) design to a 25x29 grid by adding
# 4 rows (2 top, 2 bottom) and 2 cols (1 left, 1 right).  Seed: best_design
# from ga_impedance_transfer_21x27_scratch_via_v2 (cost ≈ -77.2).
#
# Active actions: flip_01, flip_via, regional_density  (same as base).
# No series cap pairs, no shunt caps.
# ===========================================================================

_base_: ./base_impedance_transfer_via.yaml

virtuoso_config: "/volumes/research-localdata/mcao53/RFIC_RL/virtuoso_engine/config_impedance_transfer.yaml"
output_dir: "/volumes/research-localdata/mcao53/Sim_engine_results/ga_impedance_transfer_25x29_finetune_via_r2"

layout:
  pixel_size: 12.5
  grid_size:  10.0

grid:
  rows: 25   # 21 + 4 extra rows
  cols: 29   # 27 + 2 extra cols
  n_max_vias: 4

seed: 44

ga:
  n_gen: 300

  # --- Expansion seeding from 21x27 best design ---
  finetune_design_path: "/volumes/research-localdata/mcao53/Sim_engine_results/ga_impedance_transfer_21x27_scratch_via_v2/sims/gen299_ind4/worker_0/pixsimple_r21c27_ps12p5_gs10p0_x4e3bef_w0/config.yaml"

  finetune_expand:
    enabled:             true
    p_completely_random: 0.10   # 10 % fully random — the rest are seeded expansions
    p_embed:             0.50   # 50 % center-embed with density-sampled outer fill
    p_random_insertion:  0.50   # 50 % insert rows/cols one at a time
    p_duplicate:         0.50   # within random_insertion: duplicate adjacent row/col
    p_random_fill:       0.35   # within random_insertion: random 0/1 fill
    p_zero_pad:          0.15   # within random_insertion: zero-pad boundary edges
    embed_density_min:   0.0    # outer fill density range [min, max]
    embed_density_max:   0.5
    zero_pad_first:      true   # individual 0 = zero-padded (exact centred seed)
    init_max_mutations:  12     # 1..12 random mutations applied to each seeded individual
    n_immigrants_expanded: 2    # each immigrant generation uses an expanded seed copy
