# ===========================================================================
# GA Configuration — Switchable Filter Optimiser
#
# Three-state switchable filter (matches sa_config.yaml task):
#   State 0: passband at  7 GHz  ( 6– 8 GHz)
#   State 1: passband at 24 GHz  (22–26 GHz)
#   State 2: passband at 40 GHz  (38–42 GHz)
#
# The optimiser uses ParallelVirtuosoEngine to simulate the population.
# Each design is a pixelated_design_simple run that produces one .s2p file
# per filter state.
# ===========================================================================

# ---------------------------------------------------------------------------
# Path to the Virtuoso engine base config (shared physical/PDK settings).
# ---------------------------------------------------------------------------
virtuoso_config: "/disk/mcao53/RFIC_RL/virtuoso_engine/config_reduced_inductor_set.yaml"

# Root directory for all GA outputs (progress log, best design, sim results)
output_dir: "/disk/mcao53/Sim_engine_results/ga_filter_results_single_ind_2"

# ---------------------------------------------------------------------------
# GRID / DESIGN SPACE  (matches sa_config.yaml)
# ---------------------------------------------------------------------------
grid:
  rows: 21              # number of pixel rows
  cols: 27              # number of pixel columns (col 0 and col N-1 are feed columns)
  n_states: 3           # number of filter states (= number of switch-state vectors)

  # --- Feasibility constraints (hard bounds enforced on every design) ---
  min_switches: 2       # minimum number of switch pixels (type 3) allowed
  max_switches: 6       # maximum number of switch pixels (type 3) allowed
  max_inductors: 10     # maximum number of inductor pixels (type 2) allowed
  n_max_vias: 5         # maximum number of via-ground pixels (type 4) allowed

  # --- Initialisation ranges (sampled uniformly for each random design) ---
  init_min_switches: 4  # lower bound for switches placed in a new random design
  init_max_switches: 6  # upper bound for switches placed in a new random design
  init_min_inductors: 4 # lower bound for inductors placed in a new random design
  init_max_inductors: 8 # upper bound for inductors placed in a new random design
  init_min_vias: 0      # lower bound for vias placed in a new random design
  init_max_vias: 2      # upper bound for vias placed in a new random design

  # Switch series capacitance range (Farads)
  cap_min: 200.0e-15    # 200 fF
  cap_max: 1000.0e-15   # 1000 fF

  # Number of discrete inductance choices in inductor_translation_table (config.yaml)
  n_inductor_values: 2
  single_inductor_value: true  # if true, all inductors share the same value index

  # --- Cap pixel pairs (disabled; set enable_cap_pairs: true and non-zero action_weights to use) ---
  enable_cap_pairs:  true
  max_cap_pairs:     8
  cap_pair_init_min: 0           # min cap pairs placed in a new random design
  cap_pair_init_max: 4           # max cap pairs placed in a new random design (-1 or omit = use max_cap_pairs)
  cap_pair_min:      50.0e-15    # 50 fF
  cap_pair_max:      1000.0e-15  # 1000 fF
  cap_pair_sigma:    50.0e-15    # Gaussian noise std for pair perturbation
  cap_pair_min_dist: 2           # min Chebyshev distance max(|dr|,|dc|) between endpoints
  cap_pair_max_dist: 3           # max Chebyshev distance max(|dr|,|dc|) between endpoints
                                 # (diagonal pairs are allowed in addition to axis-aligned)

# ---------------------------------------------------------------------------
# FILTER TARGET SPECIFICATIONS  (matches sa_config.yaml — 7/24/40 GHz version)
# ---------------------------------------------------------------------------
filter_specs:
  - state_index:     0
    passband:        [6.0e9, 8.0e9]        # 7 GHz centre, ±1 GHz bandwidth
    passband_min_db: -0.0
    stopband_regions:
      - [4.0e9,   6.0e9]                   # below passband
      - [8.0e9,  14.0e9]                   # above passband
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 3.0
    stopband_weight: 1.0
    cross_stopband_regions:
      - [14.0e9, 65.0e9]
    cross_stopband_max_db: -20.0
    cross_stopband_weight: 1.0
    enable_s11_cost:           true       # set true to add S11 reflection penalties
    s11_passband_max_db:       -20.0       # want low S11 in passband (good match)
    s11_stopband_min_db:       -0.0       # want high S11 in stopband (high reflection)
    s11_cross_stopband_min_db: -0.0

  - state_index:     1
    passband:        [22.0e9, 26.0e9]      # 24 GHz centre, ±2 GHz bandwidth
    passband_min_db: -0.0
    stopband_regions:
      - [14.0e9, 22.0e9]                   # below passband
      - [26.0e9, 32.0e9]                   # above passband
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 3.0
    stopband_weight: 1.0
    cross_stopband_regions:
      - [6.0e9,  14.0e9]
      - [32.0e9, 65.0e9]
    cross_stopband_max_db: -20.0
    cross_stopband_weight: 1.0
    enable_s11_cost:           true
    s11_passband_max_db:       -20.0
    s11_stopband_min_db:       -0.0
    s11_cross_stopband_min_db: -0.0

  - state_index:     2
    passband:        [38.0e9, 42.0e9]      # 40 GHz centre, ±2 GHz bandwidth
    passband_min_db: -0.0
    stopband_regions:
      - [32.0e9, 38.0e9]                   # below passband
      - [42.0e9, 50.0e9]                   # above passband
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 3.0
    stopband_weight: 1.0
    cross_stopband_regions:
      - [6.0e9,  32.0e9]
      - [50.0e9, 65.0e9]
    cross_stopband_max_db: -20.0
    cross_stopband_weight: 1.0
    enable_s11_cost:           true
    s11_passband_max_db:       -20.0
    s11_stopband_min_db:       -0.0
    s11_cross_stopband_min_db: -0.0

# ---------------------------------------------------------------------------
# GENETIC ALGORITHM PARAMETERS
# ---------------------------------------------------------------------------
ga:
  # Population scheduling: starts at pop_size_start, decrements by pop_size_step
  # every (n_gen // n_steps) generations until reaching pop_size_end.
  pop_size_start:  200    # initial population size
  pop_size_end:    40    # final population size
  pop_size_step:   20    # decrement per schedule step
  elite_fraction:  0.20  # n_elite = max(3, round(current_pop_size * elite_fraction))
  n_gen:    100          # total number of generations
  n_immigrants: 2        # fresh random designs injected every generation
  n_keep_bad:  1         # non-elite individuals from the bottom 50% preserved unchanged

  # Operators
  p_crossover: 0.7       # probability of applying crossover (vs. cloning fitter parent)
  p_mutation:  0.7       # probability of applying a mutation to each offspring
  crossover_method: "block"  # "zig_zag" | "weighted_clustering" | "block"
  n_centroids: 4         # max cluster centroids for weighted_clustering; actual count drawn randomly from [2, n_centroids] each call
  block_min_size: 10    # minimum block width/height for block crossover
  block_max_size: 20     # maximum block width/height for block crossover

  # Selection
  selection:       "tournament"
  tournament_size: 5

  # Parallel simulation workers (one Virtuoso instance per worker)
  n_parallel: 5

  # Mutation action parameters (matches sa_config.yaml values)
  n_regular_flip: 25         # max pixels to flip per flip_01 action
  cap_sigma:      50.0e-15   # Gaussian noise std for cap perturbation (50 fF)
  via_flip_max_count: 3      # max vias to add or remove per flip_via action

  # Per-action sampling weights (relative). Cap-pair actions are 0.0 because
  # enable_cap_pairs is false — set them to e.g. 3.0 when enabling cap pairs.
  action_weights:
    flip_01:             4.0
    move_switch:         2.0
    flip_inductor:       1.0
    flip_inductor_value: 2.0
    perturb_caps:        4.0
    flip_switch_state:   8.0
    add_cap_pair:        4.0
    remove_cap_pair:     4.0
    perturb_pair_caps:   4.0
    flip_inductor_state: 8.0
    flip_via:            2.0

  # State-wise champion elitism: preserve the best design per filter state
  # so crossover can mix frequency-specific experts.
  use_state_champions: true
  p_champion_parent: 0.5        # probability that p1 is forced to be a state champion
  dynamic_state_assignment: true  # use Hungarian algorithm to assign sim states → specs

  # Best-design exploitation: each generation, fire N switch-state-only mutations
  # of the global best design and add them to the evaluation pool.
  exploitation_n: 5
  # Weights for exploitation mutations — only flip_switch_state (idx 5) and
  # flip_inductor_state (idx 9) are active; all structural actions are 0.
  # [flip_01, move_switch, flip_inductor, flip_inductor_value,
  #  perturb_caps, flip_switch_state, add_cap_pair, remove_cap_pair, perturb_pair_caps, flip_inductor_state, flip_via]
  exploitation_action_weights:
    flip_01:             0.0
    move_switch:         4.0
    flip_inductor:       0.0
    flip_inductor_value: 0.0
    perturb_caps:        4.0
    flip_switch_state:   4.0
    add_cap_pair:        0.0
    remove_cap_pair:     0.0
    perturb_pair_caps:   4.0
    flip_inductor_state: 4.0
    flip_via:            2.0

  # ---------------------------------------------------------------------------
  # Plotting
  # ---------------------------------------------------------------------------
  feasibility_cost_threshold: 1.0e6  # costs above this are excluded from mean/worst in plots
  population_plot_top_k: 5           # top-k individual trajectories in ga_population_behavior.png

# Random seed (set to null for non-deterministic)
seed: 42
