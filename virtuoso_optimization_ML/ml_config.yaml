# =============================================================================
# ml_config.yaml — Online ML optimizer for the switchable filter design
# =============================================================================

virtuoso_config: "/disk/mcao53/RFIC_RL/virtuoso_engine/config.yaml"
output_dir:      "/disk/mcao53/Sim_engine_results/ml_filter_results_try_7"

# -----------------------------------------------------------------------------
# GRID / DESIGN SPACE
# Mirrors the SA/GA config structure.
# -----------------------------------------------------------------------------
grid:
  rows:              20
  cols:              22
  n_switches:        4
  n_switches_min:    2    # ML feasibility: minimum allowed switch count
  n_switches_max:    6    # ML feasibility: maximum allowed switch count
  max_inductors:     15
  n_states:          2
  cap_min:           200.0e-15   # 200 fF
  cap_max:           1000.0e-15  # 1 pF
  n_inductor_values: 4           # entries in the inductor_translation_table

# -----------------------------------------------------------------------------
# FILTER TARGET SPECIFICATIONS
# Same format as SA/GA filter_specs.
# State 0: 40 GHz passband  |  State 1: 20 GHz passband
# -----------------------------------------------------------------------------
filter_specs:
  - state_index: 0
    passband: [36.0e9, 44.0e9]
    passband_min_db: -3.0
    stopband_regions:
      - [32.0e9, 36.0e9]
      - [44.0e9, 48.0e9]
    stopband_max_db: -25.0
    cross_stopband_regions:
      - [10.0e9, 25.0e9]
    cross_stopband_max_db: -15.0
    weight: 1.0

  - state_index: 1
    passband: [18.0e9, 22.0e9]
    passband_min_db: -3.0
    stopband_regions:
      - [15.0e9, 17.0e9]
      - [23.0e9, 25.0e9]
    stopband_max_db: -25.0
    cross_stopband_regions:
      - [25.0e9, 45.0e9]
    cross_stopband_max_db: -15.0
    weight: 1.0

# -----------------------------------------------------------------------------
# S-PARAMETER FREQUENCY GRID
# All ML modules interpolate Touchstone files onto this canonical grid.
# -----------------------------------------------------------------------------
s_param:
  freq_min: 0.0e9     # 1 GHz
  freq_max: 50.0e9    # 50 GHz
  n_freq:   101       # number of uniformly spaced points

# -----------------------------------------------------------------------------
# ENCODING
# Gap between pixel-type regions in the [0,1] float encoding.
# -----------------------------------------------------------------------------
encoding:
  region_gap: 0.05

# -----------------------------------------------------------------------------
# GENERATIVE MODEL (conditional flow matching)
# -----------------------------------------------------------------------------
generative_model:
  cond_dim:       256     # S-param conditioning vector dimension (legacy AdaGN mode)
  t_dim:          128     # time embedding dimension
  base_channels:  64      # U-Net first-stage channel count
  n_steps:        100     # Euler integration steps at inference
  guidance_scale: 2.0     # classifier-free guidance scale (1.0 = no guidance)
  p_uncond:       0.1     # CFG null-conditioning dropout probability
  lr:             5.0e-4
  batch_size:     32
  fm_grad_clip:   1.0     # gradient clip budget for flow-matching loss (separate backward pass)
  clf_grad_clip:  0.1     # gradient clip budget for classifier loss (separate, tighter)
  # constraint_weight removed — feasibility is now handled by FeasibilityClassifier

  # Cross-attention conditioning (set use_cross_attn: true to enable)
  # Replaces AdaGN spec conditioning with spatial cross-attention:
  #   s_param mode    → spec tokens (B, n_states*32, seq_d_model); each CNN freq-bin is a token
  #   score_based mode → spec tokens (B, n_states,   seq_d_model); each filter state is a token
  # Time conditioning remains in AdaGN; cond_dim is ignored when use_cross_attn is true.
  use_cross_attn: true   # set true to enable cross-attention spec conditioning
  seq_d_model:    128     # token embedding dimension for cross-attention encoders
  ca_n_heads:     4       # number of attention heads in cross-attention blocks

# -----------------------------------------------------------------------------
# WORLD MODEL (single heteroscedastic surrogate + RND)
# -----------------------------------------------------------------------------
world_model:
  lr:                  1.0e-4
  batch_size:          32
  std_scale:           3.0      # calibration for variance-based confidence metric
  var_threshold:       0.01     # trigger real simulation if mean(variance) > this
  correction_interval: 500      # run Step 5 every N iterations

  # Random Network Distillation (OOD detection)
  use_rnd:         false
  rnd_threshold:   0.1          # trigger real simulation if rnd_score > this
  rnd_lr:          1.0e-4

# -----------------------------------------------------------------------------
# FEASIBILITY CHECKS
# Toggle individual design-rule checks applied during ML sampling.
# Disabling a check relaxes that constraint — useful for exploration or when
# the generative model + classifier are trusted to handle it implicitly.
# -----------------------------------------------------------------------------
feasibility_checks:
  check_connectivity:           false   # rule a: 8-connected path left→right feed
  check_switch_spacing:         true   # rule b: switches isolated from switches/inductors
  check_inductor_spacing:       true   # rule c: inductors isolated from inductors/switches
  check_inductor_count:         true   # rule d: total inductors <= max_inductors
  check_switch_count:           true   # rule e: switch count in [n_switches_min, n_switches_max]
  check_feed_columns:           true   # rule f: exactly one non-zero pixel per feed column
  check_switch_states_distinct: true   # rule g: all switch state vectors are distinct

# -----------------------------------------------------------------------------
# FEASIBILITY CLASSIFIER
# -----------------------------------------------------------------------------
feasibility_classifier:
  enabled:                  true
  guidance_weight:          0.0    # weight of clf loss in flow-matching train_step
  sample_guidance_weight:   0    # weight of clf gradient guidance during ODE sampling (increased from 0.5)
  warmup_iters:             100    # ramp clf guidance weight from 0 → full over this many iters
  train_every_n_iters:      1
  n_train_steps:            32
  lr:                       1.0e-4
  min_infeasible_store_size: 50    # minimum infeasible images before classifier trains
  max_infeasible_store_size: 5000   # rolling store capacity

# -----------------------------------------------------------------------------
# REPLAY BUFFER  (feasible designs only)
# -----------------------------------------------------------------------------
replay_buffer:
  max_size:      10000
  alpha_perf:    0.6       # weight for performance-rank term (high-score real-sim designs)
  alpha_real:    0.4       # weight for real-data bonus term
  real_bonus:    2.0       # additive bonus for real simulation entries
  alpha_random:  0.5       # uniform exploration floor (all entries stay reachable)

# -----------------------------------------------------------------------------
# GUIDANCE MODE
# "s_param"    : condition on ideal target S-parameters (original mode)
# "score_based": condition on per-region penalty scores derived from real sims
#                Requires reload of warmup sim folder; avoids instability from
#                ideal (unreachable) S-param targets.
# -----------------------------------------------------------------------------
guidance:
  mode:               score_based   # "s_param" or "score_based"
  improvement_factor: 0.9       # score target = best_seen_scores × this factor
  n_score_components: 4         # lower_reject / passband / higher_reject / cross_band

# -----------------------------------------------------------------------------
# TRAINING LOOP
# -----------------------------------------------------------------------------
training:
  warmup_n_designs:      200    # number of random designs to simulate at warmup
  n_iterations:          1000    # total online training iterations
  n_gen_samples:         20     # designs sampled from gen model per iteration
  n_sim_max:             10      # max new real simulations per iteration
  gen_train_steps:          8   # Adam steps for generative model per iteration
  wm_train_steps:           8   # Adam steps for world model per iteration
  wm_correction_n:          5   # WM-labeled entries to re-simulate in Step 5
  max_resample_attempts:    10  # retries to get feasible decoded design
  # max_infeasible_per_iter removed — infeasible images go to classifier store, not buffer
  # Layout-only warmup: N random feasible designs, no simulation, no guidance (null cond.)
  # Teaches the flow model the feasible topology space before conditioning is introduced.
  warmup_n_random_feasible:           2000   # set to 0 to disable
  warmup_random_feasible_train_steps: 500

# -----------------------------------------------------------------------------
# WORLD MODEL ROLLOUT TRAINING FOR GENERATIVE MODEL
# The gen model generates a pool of samples; the world model labels them with
# predicted S-params (or scores). Infeasible samples receive large penalty
# labels. Multiple gradient steps are done on this pool without any real
# simulation. Runs more steps than gen_train_steps to exploit the fast WM.
# -----------------------------------------------------------------------------
gen_wm_rollout:
  enabled:            true
  n_rollout_steps:    32       # gradient steps per iteration (> gen_train_steps)
  pool_size:          128      # samples generated once per iteration for rollout
  infeasible_penalty: 100.0   # penalty score (score_based) or dB penalty (s_param)
  grad_clip:          1.0

# -----------------------------------------------------------------------------
# PARALLEL SIMULATION
# -----------------------------------------------------------------------------
parallel:
  num_workers: 5

# -----------------------------------------------------------------------------
# CHECKPOINTING
# -----------------------------------------------------------------------------
checkpoint_interval: 50   # save checkpoint every N iterations

# Optional: set seed for reproducibility (null = random)
seed: 42

# Debug: print pixel-type counts for every generated design in Step 1
debug: true
