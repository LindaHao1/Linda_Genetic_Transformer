# ===========================================================================
# SA Configuration — Switchable Filter Optimiser
#
# Two-state switchable filter:
#   State 0: passband at 7 GHz   (6–8 GHz)
#   State 1: passband at 20 GHz  (18–22 GHz)
#
# The optimiser uses ParallelVirtuosoEngine to simulate N_parallel
# candidate designs per SA step.  Each design is a pixelated_design_simple
# run that produces one .s2p file per filter state.
# ===========================================================================

# ---------------------------------------------------------------------------
# Path to the Virtuoso engine base config (shared physical/PDK settings).
# SA config overrides pixelated.pixel_state_matrix, state_list, cap_values
# and project.parent_output_dir for each candidate run.
# ---------------------------------------------------------------------------
virtuoso_config: "/disk/mcao53/RFIC_RL/virtuoso_engine/config.yaml"

# Root directory for all SA outputs (progress log, best design, sim results)
output_dir: "/disk/mcao53/Sim_engine_results/sa_filter_results_700u_3state"

# ---------------------------------------------------------------------------
# GRID / DESIGN SPACE
# ---------------------------------------------------------------------------
grid:
  rows: 21              # number of pixel rows
  cols: 27             # number of pixel columns (col 0 and col N-1 are feed columns)
  n_switches: 4         # exact number of switch pixels (type 3) required
  max_inductors: 10     # maximum number of inductor pixels (type 2) allowed
  n_initial_inductors: 4  # number of inductor pixels to place in the initial random design
                          # (capped at max_inductors; SA can add/remove inductors freely)

  # Optional ranges for randomly sampling initial counts.
  # When set, the initial design is generated with a count drawn uniformly
  # from [min, max] instead of the fixed value above.  Omit (or set equal to
  # the fixed value) to keep the original fixed-count behaviour.
  n_switches_min: 2
  n_switches_max: 6
  n_initial_inductors_min: 0
  n_initial_inductors_max: 8
  n_init_vias_min: 0
  n_init_vias_max: 4
  n_states: 3           # number of filter states (= number of switch-state vectors)

  # Switch series capacitance range (Farads)
  cap_min: 200.0e-15   # 300 fF
  cap_max: 1000.0e-15   # 1000 fF

  # Number of discrete inductance choices in inductor_translation_table (config.yaml)
  n_inductor_values: 4

  # Via-ground pixels (type 4): always shorted to GND in simulation
  n_max_vias: 5          # maximum number of via-ground pixels allowed
  n_init_vias: 2         # via-ground pixels to place in the initial random design (used when no range set)

  # Cap pixel pairs: inter-pixel coupling capacitors (axis-aligned, type-1 endpoints only)
  enable_cap_pairs: false    # set to true to enable cap-pair features (initial + SA actions)
  max_cap_pairs: 5           # maximum number of cap pixel pairs (only used when enable_cap_pairs: true)
  cap_pair_min: 50.0e-15     # 50 fF minimum pair capacitance
  cap_pair_max: 1000.0e-15    # 1000 fF maximum pair capacitance
  cap_pair_sigma: 50.0e-15   # 20 fF Gaussian noise std for pair cap perturbation
  cap_pair_min_dist: 2       # min Manhattan distance between pair endpoints (2 = 1 pixel in between)
  cap_pair_max_dist: 3       # max Manhattan distance between pair endpoints (3 = 2 pixels in between)

# ---------------------------------------------------------------------------
# FILTER TARGET SPECIFICATIONS
# Each entry defines the performance target for one filter state.
#
# state_index        : index into state_list (0-based)
# passband           : [f_start, f_stop] in Hz — desired pass region
# passband_min_db    : minimum acceptable S21 in dB (penalty if below)
# stopband_regions   : list of [f_start, f_stop] reject bands (Hz)
# stopband_max_db    : maximum acceptable S21 in dB (penalty if above)
# weight             : contribution weight to total cost
# ---------------------------------------------------------------------------
filter_specs:
  ####### 7-24-40G version
  - state_index:     0
    passband:        [6.0e9, 8.0e9]        # 7 GHz centre, ±1 GHz bandwidth
    passband_min_db: -0.0
    stopband_regions:
      - [4.0e9,   6.0e9]                   # below passband
      - [8.0e9,  14.0e9]                   # above passband
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 1.0
    stopband_weight: 1.0
    # Decoupling: must also attenuate at states 1 and 2 passbands (24 GHz, 40 GHz)
    cross_stopband_regions:
      - [22.0e9, 26.0e9]
      - [38.0e9, 42.0e9]
    cross_stopband_max_db: -20.0
    cross_stopband_weight: 1.0
    enable_s11_cost:           false       # set true to add S11 reflection penalties
    s11_passband_max_db:       -30.0       # want low S11 in passband (good match)
    s11_stopband_min_db:       -10.0       # want high S11 in stopband (high reflection)
    s11_cross_stopband_min_db: -10.0

  - state_index:     1
    passband:        [22.0e9, 26.0e9]      # 24 GHz centre, ±2 GHz bandwidth
    passband_min_db: -0.0
    stopband_regions:
      - [14.0e9, 22.0e9]                   # below passband
      - [26.0e9, 32.0e9]                   # above passband
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 1.0
    stopband_weight: 1.0
    # Decoupling: must also attenuate at states 0 and 2 passbands (7 GHz, 40 GHz)
    cross_stopband_regions:
      - [6.0e9,  8.0e9]
      - [38.0e9, 42.0e9]
    cross_stopband_max_db: -20.0
    cross_stopband_weight: 1.0
    enable_s11_cost:           false
    s11_passband_max_db:       -30.0
    s11_stopband_min_db:       -10.0
    s11_cross_stopband_min_db: -10.0

  - state_index:     2
    passband:        [38.0e9, 42.0e9]      # 40 GHz centre, ±2 GHz bandwidth
    passband_min_db: -0.0
    stopband_regions:
      - [32.0e9, 38.0e9]                   # below passband
      - [42.0e9, 50.0e9]                   # above passband
    stopband_max_db: -25.0
    weight: 1.0
    passband_weight: 1.0
    stopband_weight: 1.0
    # Decoupling: must also attenuate at states 0 and 1 passbands (7 GHz, 24 GHz)
    cross_stopband_regions:
      - [6.0e9,  8.0e9]
      - [22.0e9, 26.0e9]
    cross_stopband_max_db: -20.0
    cross_stopband_weight: 1.0
    enable_s11_cost:           false
    s11_passband_max_db:       -30.0
    s11_stopband_min_db:       -10.0
    s11_cross_stopband_min_db: -10.0

# ---------------------------------------------------------------------------
# SIMULATED ANNEALING PARAMETERS
# ---------------------------------------------------------------------------
sa:
  # Temperature schedule
  T_start:  100.0    # initial temperature (cost units: dB^2)
  T_end:    0.1      # final temperature
  n_iter:   1000        # total number of SA iterations
  cooling:  "linear"  # "geometric" or "linear"

  # Parallel candidates per step
  # Each candidate is simulated on its own Virtuoso worker simultaneously.
  n_parallel: 4

  # Action parameters
  n_regular_flip: 25         # max pixels to flip per flip_01 action
  cap_sigma:      50.0e-15   # Gaussian noise std for cap perturbation (50 fF)
  max_switch_state_flips:   3  # max bits to flip per flip_switch_state action (k drawn from [1, max])
  max_inductor_state_flips: 3  # max bits to flip per flip_inductor_state action (k drawn from [1, max])
  via_flip_max_count: 3        # max vias to add or remove per flip_via action

  # Per-action sampling weights (relative, not required to sum to 1)
  # Order: [flip_01, modify_switch, flip_inductor, flip_inductor_value,
  #         perturb_caps, flip_switch_state,
  #         add_cap_pair, remove_cap_pair, perturb_pair_caps, flip_inductor_state, flip_via]
  action_weights: [4.0, 4.0, 1.0, 4.0, 8.0, 8.0, 3.0, 3.0, 3.0, 8.0, 8.0]

# Random seed (set to null for non-deterministic)
seed: 45

# If true, the initial random design is regenerated until the pixel path from
# the left feed column to the right feed column is fully 4-connected
# (Manhattan / up-down-left-right only, no diagonals).  This produces a
# physically cleaner starting point at the cost of more generation attempts.
require_4_connected: true

# Dynamic state assignment: before computing cost, find the bijective mapping
# of simulated states to filter specs that minimises total cost (Hungarian algorithm).
# This handles cases where the optimizer produces a design whose states are
# "swapped" relative to the spec ordering — e.g. simulated state 0 actually
# behaves like the 40 GHz filter while state 2 behaves like the 7 GHz filter.
# Uses scipy.optimize.linear_sum_assignment when available, falls back to
# brute-force permutations (safe for N ≤ 8).  Set to false to use fixed ordering.
dynamic_state_assignment: true
